name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  package-version:
    name: Modelence version (no dev tags)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check modelence version is a plain release
        run: |
          VERSION="$(node -p "require('./packages/modelence/package.json').version")"
          echo "modelence: $VERSION"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=packages/modelence/package.json::modelence version '$VERSION' is a prerelease — bump to a plain release before merging"
            exit 1
          fi

  build:
    name: Build Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install modelence dependencies
        working-directory: ./packages/modelence
        run: npm ci

      - name: Run lint check
        working-directory: ./packages/modelence
        run: npm run lint:check

      - name: Run format check
        working-directory: ./packages/modelence
        run: npm run format:check

      - name: Run tests
        working-directory: ./packages/modelence
        run: npm run test

      - name: Build modelence
        working-directory: ./packages/modelence
        run: npm run build 